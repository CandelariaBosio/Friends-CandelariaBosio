    <main class="seccion-monica">

        <h1 class="titulomonica">El recetario de Monica</h1>

        <!-- Filtros con sus IDs y el evento onchange -->
        <div class="filtros-container">
            <select class="filtro-select" id="filtroTipo" onchange="filtrarRecetas()">
                <option value="">Tipo de comida</option>
                <option value="almuerzo-cena">Almuerzo / Cena</option>
                <option value="postre">Postre</option>
            </select>

            <select class="filtro-select" id="filtroDificultad" onchange="filtrarRecetas()">
                <option value="">Nivel de dificultad</option>
                <option value="facil">Fácil</option>
                <option value="intermedio">Intermedio</option>
                <option value="dificil">Difícil</option>
            </select>

            <select class="filtro-select" id="filtroTiempo" onchange="filtrarRecetas()">
                <option value="">Tiempo de preparación</option>
                <option value="30min">30 minutos</option>
                <option value="mas-1h">Más de 1 hora</option>
            </select>
        </div>

        <!-- Contenedor donde JavaScript insertará las tarjetas dinámicamente -->
    <section class="recetas-grid" id="gridRecetas">
    </section>
